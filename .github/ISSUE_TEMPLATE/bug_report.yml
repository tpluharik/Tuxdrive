name: Bug report
description: Report a reproducible TuxDrive failure or incorrect behaviour
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Remove OAuth tokens, passwords, client secrets, private URLs, personal paths, and confidential file names before submitting logs or screenshots.
  - type: input
    id: version
    attributes:
      label: TuxDrive version
      description: Run `tuxdrive --version` or provide the installed package version.
      placeholder: "0.11.4"
    validations:
      required: true
  - type: input
    id: ubuntu
    attributes:
      label: Ubuntu and desktop version
      placeholder: "Ubuntu 26.04, GNOME, Wayland"
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options:
        - Google Drive
        - Microsoft OneDrive
        - Dropbox
        - Box
        - pCloud
        - MEGA
        - Proton Drive
        - Nextcloud
        - Multiple providers
        - Not provider-specific
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Job mode
      options:
        - Two-way synchronization
        - Download mirror
        - Upload mirror
        - Streaming drive (files on demand)
        - OAuth/account setup
        - Application startup or tray
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest repeatable sequence.
      placeholder: |
        1. Connect an account...
        2. Add a job...
        3. Change/open...
        4. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Paste only relevant lines and remove credentials, tokens, personal data, and confidential file names.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I tested the newest available version.
          required: true
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed credentials, tokens, personal information, and confidential content.
          required: true
