name: Feature request
description: Suggest a TuxDrive capability or workflow improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user problem rather than only the desired implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: Explain the controls, workflow, and expected result.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Google Drive
        - Microsoft OneDrive
        - Synchronization engine
        - Streaming/files on demand
        - OAuth/accounts
        - Desktop UI and tray
        - Packaging/installation
        - Logging/recovery
        - Documentation/accessibility
        - Other
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Data-safety and compatibility considerations
      description: Note possible deletion, conflict, privacy, provider API, or migration effects.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for a similar proposal.
          required: true
        - label: This request contains no credentials, tokens, or confidential data.
          required: true
