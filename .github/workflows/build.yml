name: Build TuxDrive

on:
  push:
  pull_request:

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install . bandit pip-audit
      - name: Static security analysis
        run: bandit -q -r src -lll && pip-audit -r requirements-security.txt
      - name: Unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q src
      - name: Build Debian package
        run: sh scripts/build-deb.sh
      - name: Inspect Debian package
        run: dpkg-deb --info dist/tuxdrive_0.18.1_all.deb && dpkg-deb --contents dist/tuxdrive_0.18.1_all.deb
      - name: Generate dependency SBOM
        run: pip-audit -r requirements-security.txt --format cyclonedx-json --output dist/tuxdrive_0.18.1.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tuxdrive-deb
          path: |
            dist/tuxdrive_0.18.1_all.deb
            dist/tuxdrive_0.18.1.cdx.json

  debian-core-matrix:
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "debian:12", "debian:13"]
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - name: Install build prerequisites
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y git python3 dpkg-dev
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build adaptive package
        run: sh scripts/build-deb.sh
      - name: Install mandatory core only
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ./dist/tuxdrive_0.18.1_all.deb
      - name: Verify installed layout and host discovery
        run: tuxdrive --version && tuxdrive --system-check --json
