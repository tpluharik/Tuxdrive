[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tuxindrive"
version = "0.25.3"
description = "Native multi-provider cloud sync and streaming client for Debian desktops"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "TuxInDrive contributors"}]
dependencies = ["cryptography>=50.0.0,<51", "defusedxml>=0.7.1,<0.8"]

[project.scripts]
tuxindrive = "tuxindrive.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
